<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMU Nautical Science – Self-Study Quiz</title>
<style>
:root{
  --bg:#f3f6fb;--card:#ffffff;--text:#1b2434;--muted:#5d6b82;--line:#dde4ef;
  --primary:#0b5ea8;--primary-d:#084a86;--accent:#13a3a3;
  --ok:#14804a;--ok-bg:#e3f6ec;--bad:#b3261e;--bad-bg:#fdeaea;--warn:#a86400;--warn-bg:#fff3dc;
  --shadow:0 2px 10px rgba(16,35,70,.08);--radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0f1624;--card:#18223a;--text:#e8edf7;--muted:#9fb0cc;--line:#2a3856;
  --primary:#4aa3f0;--primary-d:#2f86d3;--accent:#34c9c9;
  --ok:#4fd18b;--ok-bg:#12372a;--bad:#ff8c84;--bad-bg:#40191a;--warn:#ffc266;--warn-bg:#3b2d12;
  --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3{margin:0 0 .5rem;line-height:1.25}
.topbar{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.topbar-in{max-width:1100px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.1rem;margin-right:auto;display:flex;align-items:center;gap:.5rem}
.brand small{display:block;font-weight:400;font-size:.72rem;opacity:.85}
.nav{display:flex;gap:.3rem;flex-wrap:wrap}
.nav button{background:transparent;border:0;color:#fff;padding:.45rem .8rem;border-radius:999px;font-size:.92rem}
.nav button:hover{background:rgba(255,255,255,.18)}
.nav button.active{background:#fff;color:var(--primary-d);font-weight:600}
.icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:.4rem .7rem}
main{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 3rem}
.footer{max-width:1100px;margin:0 auto;padding:0 1rem 2rem;color:var(--muted);font-size:.8rem;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hero{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:0}
.hero p{margin:.2rem 0 .8rem;opacity:.95}
.stat{text-align:center;padding:.9rem .5rem}
.stat b{display:block;font-size:1.7rem;color:var(--primary)}
.stat span{color:var(--muted);font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--card);padding:.55rem 1rem;border-radius:10px;font-weight:600;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-d)}
.btn.light{background:#fff;color:var(--primary-d);border-color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:.3rem .7rem;font-size:.85rem}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.subject-card{display:flex;flex-direction:column;gap:.4rem}
.subject-card .ico{font-size:1.8rem}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}.bar.bad>i{background:var(--bad)}.bar.warn>i{background:#e0a100}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--card);padding:.4rem .8rem;border-radius:999px;font-size:.9rem}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pick{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.7rem;text-align:left}
.pick.on{border-color:var(--primary);background:rgba(11,94,168,.08)}
.pick .ico{font-size:1.4rem;display:block}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.8rem}
.field label,.label{font-weight:600;font-size:.92rem}
select{padding:.55rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.check{display:flex;align-items:center;gap:.5rem}
.badge{display:inline-block;padding:.12rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;background:rgba(11,94,168,.12);color:var(--primary)}
.badge.d0{background:var(--ok-bg);color:var(--ok)}
.badge.d1{background:var(--warn-bg);color:var(--warn)}
.badge.d2{background:var(--bad-bg);color:var(--bad)}
.badge.d3{background:#efe4ff;color:#6a2fb8}
:root[data-theme="dark"] .badge.d3{background:#2f1f4d;color:#c9a6ff}
.quiz-head{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.quiz-head .grow{flex:1;min-width:140px}
.timer{font-weight:700;background:var(--card);border:1px solid var(--line);padding:.3rem .8rem;border-radius:999px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.qtext{font-size:1.2rem;font-weight:600;margin:.6rem 0 1rem}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);padding:.75rem .9rem;border-radius:12px}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .l{flex:0 0 auto;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--primary);background:rgba(11,94,168,.08)}
.opt.sel .l{background:var(--primary);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.explain{margin-top:1rem;padding:.8rem 1rem;border-radius:12px;background:var(--warn-bg);border-left:5px solid #e0a100}
.explain.ok{background:var(--ok-bg);border-color:var(--ok)}
.explain.bad{background:var(--bad-bg);border-color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.pbtn{width:2.1rem;height:2.1rem;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.8rem;font-weight:600}
.pbtn.ans{background:var(--primary);color:#fff;border-color:var(--primary)}
.pbtn.mk{outline:3px solid #e0a100}
.pbtn.cur{box-shadow:0 0 0 3px var(--accent)}
.star{background:transparent;border:0;font-size:1.4rem;line-height:1;color:var(--muted)}
.star.on{color:#e0a100}
.qhead{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.qhead .star{margin-left:auto}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto .5rem;background:conic-gradient(var(--primary) var(--p,0%),var(--line) 0)}
.score-ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:1.8rem;font-weight:800}
.score-ring small{display:block;font-size:.72rem;font-weight:400;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.review-item{border:1px solid var(--line);border-radius:12px;padding:.9rem;margin-bottom:.8rem;background:var(--card)}
.review-item.ok{border-left:6px solid var(--ok)}
.review-item.bad{border-left:6px solid var(--bad)}
.review-item.un{border-left:6px solid #e0a100}
.ropt{padding:.4rem .7rem;border-radius:8px;margin:.25rem 0;border:1px solid var(--line);font-size:.95rem}
.ropt.right{background:var(--ok-bg);border-color:var(--ok)}
.ropt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(30px);background:#1b2434;color:#fff;padding:.6rem 1.1rem;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sticky-foot{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
.sticky-foot .sp{flex:1}
@media (max-width:600px){
  .brand small{display:none}
  .qtext{font-size:1.08rem}
  .topbar-in{padding:.5rem .7rem}
  .nav button{padding:.4rem .6rem;font-size:.85rem}
}
@media print{.topbar,.footer,.btn-row,.sticky-foot,.toast{display:none!important}}

</style>
</head>

<script>
window.QUIZ_DATA = window.QUIZ_DATA || {};
window.QUIZ_DATA.math = {
  name: "Mathematics",
  icon: "➗",
  chapters: ["Basic Mathematics","Fractions, Decimals & Percentages","Ratio & Proportion","Algebra","Geometry & Mensuration","Trigonometry","Logarithms & Exponents","Coordinate Geometry & Angles","Nautical Mathematics","Mixed Application Problems"],
  q: [
["What is Mathematics?","The branch of science dealing with numbers, quantities, measurements, shapes and calculations","The study of living things","The study of weather only","The study of languages","In Nautical Science, mathematics is used for speed, distance, time, navigation positions and cargo measurements."],
["Natural numbers are…","Counting numbers 1, 2, 3, 4…","Numbers including negatives","Only even numbers","Only decimals","Natural numbers start from 1 and continue upward."],
["Whole numbers are…","Zero and all positive natural numbers","Only negative numbers","Only fractions","Only prime numbers","Whole numbers: 0, 1, 2, 3…"],
["Integers include…","Positive numbers, negative numbers and zero","Only positive numbers","Only fractions","Only zero","Examples: −5, −1, 0, 3, 7."],
["A rational number can be written in the form…","p/q where p and q are integers and q ≠ 0","√p only","π only","A non-terminating non-repeating decimal","Examples: 1/2, 3/4, 5/6."],
["Which of the following is an irrational number?","√2","3/4","0.5","7","Irrational numbers cannot be expressed as a ratio of integers; their decimals neither end nor repeat."],
["Which of the following is a prime number?","11","9","15","21","A prime has exactly two factors: 1 and itself."],
["Which of the following is a composite number?","9","2","7","13","A composite number has more than two factors; 9 = 1, 3, 9."],
["In the number 5,432, the place value of the digit 5 is…","5,000","500","50","5","Place value depends on position: 5 is in the thousands place."],
["Using BODMAS, the value of 10 + 5 × 2 is…","20","30","25","15","Multiplication first: 5 × 2 = 10; then 10 + 10 = 20."],

["A fraction represents…","A part of a whole","A negative number only","A whole number only","An angle","It is written as a/b where a is the numerator and b the denominator."],
["Which of the following is a proper fraction?","2/5","7/4","9/5","3/3","In a proper fraction the numerator is smaller than the denominator."],
["Which of the following is an improper fraction?","7/4","2/5","3/8","1/2","In an improper fraction the numerator is greater than or equal to the denominator."],
["Which of the following is a mixed fraction?","2½","3/4","7/4","0.5","A mixed fraction has a whole number part and a proper fraction part."],
["0.75 expressed as a fraction in simplest form is…","3/4","7/5","75/10","1/75","0.75 = 75/100 = 3/4."],
["3/5 expressed as a decimal is…","0.6","0.35","1.5","0.53","3 ÷ 5 = 0.6."],
["25% is equal to…","0.25","2.5","0.025","25","Percentage means 'out of 100': 25/100 = 0.25."],
["20% of 500 is…","100","25","50","20","(20/100) × 500 = 100."],
["A ship has 200 tonnes of cargo and 25% is unloaded. The cargo unloaded is…","50 tonnes","25 tonnes","75 tonnes","100 tonnes","(25/100) × 200 = 50 tonnes."],
["A tank holds 800 litres and 10% is used. The water remaining is…","720 litres","80 litres","780 litres","700 litres","Used = 80 L; remaining = 800 − 80 = 720 L."],

["A ratio is…","A comparison of two quantities of the same kind by division","The sum of two quantities","The product of two quantities","A single whole number","Example: 2:3."],
["The ratio 20:40 simplified is…","1:2","2:1","1:4","4:1","Divide both terms by 20 to get 1:2."],
["Proportion means…","Equality of two ratios","Difference of two numbers","Product of two numbers","A single ratio","Example: 2:4 = 3:6."],
["If 2:4 = 5:x, then x equals…","10","8","12","20","Cross-multiplying: 2x = 20, so x = 10."],
["Dividing 100 in the ratio 2:3 gives…","40 and 60","20 and 80","30 and 70","50 and 50","Total parts = 5; shares are (2/5)×100 = 40 and (3/5)×100 = 60."],
["Direct proportion means…","An increase in one quantity gives a proportional increase in the other","An increase in one gives a decrease in the other","The quantities never change","The quantities are always equal","At constant speed, more travel time means more distance."],
["For a fixed distance, increasing the speed reduces the travel time. This is an example of…","Inverse proportion","Direct proportion","No proportion","Ratio of equals","Quantities that change in opposite directions are inversely proportional."],
["A ship travels 100 NM in 5 hours. At the same speed it will travel in 10 hours…","200 NM","150 NM","100 NM","500 NM","Speed = 20 knots; distance = 20 × 10 = 200 NM."],
["5 workers finish a job in 12 days. How many days will 10 workers take (equal rates)?","6 days","24 days","12 days","3 days","Inverse proportion: 5 × 12 = 10 × x, so x = 6."],
["Ratios and proportions are useful in Nautical Science for…","Cargo distribution, fuel calculations and scale drawings","Only cooking calculations","Only spelling tests","Nothing practical","They are used for cargo, fuel, mixtures, scale drawings and ship dimension comparisons."],

["Algebra uses…","Letters and symbols to represent unknown quantities","Only geometric figures","Only whole numbers","Only maps","Example: x + 5 = 10."],
["A variable is…","A symbol, usually a letter, representing an unknown or changing quantity","A fixed number","A type of angle","A unit of speed","Examples: x, y, z."],
["A constant is…","A fixed value that does not change","A letter that changes","An unknown quantity","An equation","Examples: 2, 5, 100."],
["Solve: x + 10 = 25","x = 15","x = 35","x = 10","x = 25","x = 25 − 10 = 15."],
["Solve: 3x = 21","x = 7","x = 63","x = 18","x = 24","x = 21 ÷ 3 = 7."],
["Solve: 2x + 5 = 15","x = 5","x = 10","x = 7.5","x = 20","2x = 10, so x = 5."],
["(a + b)² expands to…","a² + 2ab + b²","a² + b²","a² − 2ab + b²","2a + 2b","This is a standard algebraic identity."],
["(a − b)² expands to…","a² − 2ab + b²","a² − b²","a² + 2ab + b²","2a − 2b","This is a standard algebraic identity."],
["Factorising x² + 5x + 6 gives…","(x + 2)(x + 3)","(x + 1)(x + 6)","(x − 2)(x − 3)","(x + 5)(x + 6)","Find two numbers with sum 5 and product 6: 2 and 3."],
["A quadratic equation is one in which…","The highest power of the variable is 2","The highest power is 1","The highest power is 3","There is no variable","General form: ax² + bx + c = 0 with a ≠ 0."],

["Geometry is the study of…","Shapes, sizes, angles, lines and dimensions","Only numbers","Only equations","Only statistics","Geometry deals with figures and their properties."],
["The sum of the interior angles of a triangle is…","180°","90°","270°","360°","This holds for every triangle."],
["A right-angled triangle has…","One angle equal to 90°","All angles equal to 60°","Three right angles","No right angle","The longest side is the hypotenuse."],
["Pythagoras' theorem states that…","c² = a² + b²","c = a + b","c² = a² − b²","c = a × b","In a right triangle the square of the hypotenuse equals the sum of squares of the other two sides."],
["The hypotenuse of a right triangle with sides 3 m and 4 m is…","5 m","7 m","12 m","25 m","c² = 9 + 16 = 25, so c = 5 m."],
["The area of a rectangle is…","Length × Breadth","Length + Breadth","½ × Length × Breadth","2(Length + Breadth)","Area is measured in square units."],
["The area of a rectangular deck measuring 50 m × 20 m is…","1,000 m²","70 m²","140 m²","500 m²","50 × 20 = 1,000 m²."],
["The area of a triangle is…","½ × Base × Height","Base × Height","Base + Height","2 × Base × Height","Half the product of base and perpendicular height."],
["The circumference of a circle of radius r is…","2πr","πr²","πr","4πr","Area is πr²; circumference is 2πr."],
["The volume of a tank 5 m long, 4 m wide and 3 m high is…","60 m³","12 m³","47 m³","20 m³","V = L × B × H = 5 × 4 × 3 = 60 m³."],

["Trigonometry studies…","The relationships between sides and angles of triangles","Only circles","Only fractions","Only percentages","It is the mathematical foundation for navigation, bearings and positions."],
["The three basic trigonometric ratios are…","Sine, cosine and tangent","Sum, product and quotient","Area, volume and length","Mean, median and mode","They relate angles to side ratios in a right triangle."],
["sin θ is defined as…","Opposite / Hypotenuse","Adjacent / Hypotenuse","Opposite / Adjacent","Hypotenuse / Opposite","Remember: sine = opposite over hypotenuse."],
["cos θ is defined as…","Adjacent / Hypotenuse","Opposite / Hypotenuse","Opposite / Adjacent","Adjacent / Opposite","Cosine = adjacent over hypotenuse."],
["tan θ is defined as…","Opposite / Adjacent","Adjacent / Hypotenuse","Opposite / Hypotenuse","Hypotenuse / Adjacent","Tangent = opposite over adjacent."],
["The value of sin 30° is…","1/2","√3/2","1","0","sin 30° = 0.5."],
["The value of cos 60° is…","1/2","√3/2","0","1","cos 60° = 0.5."],
["The value of tan 45° is…","1","0","1/2","√3","Opposite equals adjacent at 45°."],
["The fundamental trigonometric identity is…","sin²θ + cos²θ = 1","sin θ + cos θ = 1","sin θ = cos θ","tan θ = sin θ + cos θ","It holds for every angle θ."],
["Trigonometry is important in navigation because it helps in…","Calculating angles, directions and distances","Cooking meals","Painting hulls","Writing logbooks only","It supports navigation triangles, celestial navigation and position calculations."],

["An exponent indicates…","How many times a number is multiplied by itself","How many digits a number has","The sum of two numbers","The square root of a number","Example: 2³ = 2 × 2 × 2 = 8."],
["In 5³, the base is…","5","3","15","125","The base is the number being raised to a power."],
["A logarithm is…","The inverse operation of exponentiation","The same as multiplication","The same as addition","A type of angle","If aˣ = b, then log_a b = x."],
["log₁₀ 100 equals…","2","10","100","1","Because 10² = 100."],
["log₁₀ 1000 equals…","3","1000","10","2","Because 10³ = 1000."],
["The value of 2⁴ is…","16","8","6","24","2 × 2 × 2 × 2 = 16."],
["The value of 10⁰ is…","1","0","10","Undefined","Any non-zero number raised to the power zero equals 1."],
["The value of √144 is…","12","14","72","11","12 × 12 = 144."],
["The value of ∛27 is…","3","9","27","6","3 × 3 × 3 = 27."],
["The product law of logarithms states that…","log(ab) = log a + log b","log(ab) = log a × log b","log(ab) = log a − log b","log(ab) = log a ÷ log b","The logarithm of a product equals the sum of logarithms."],

["Coordinate geometry…","Uses coordinates to represent points and study geometric figures","Studies only triangles","Studies only percentages","Studies only logarithms","It links algebra and geometry."],
["The Cartesian coordinate system uses…","Two perpendicular axes, X (horizontal) and Y (vertical)","One straight line only","Three parallel lines","Only circles","Their intersection is the origin."],
["The coordinates (3, 4) are…","Numerical values that identify the position of a point","The area of a triangle","The speed of a ship","A type of fraction","The first value is x, the second is y."],
["The origin has coordinates…","(0, 0)","(1, 1)","(0, 1)","(1, 0)","It is where the X-axis and Y-axis intersect."],
["In which quadrant is x negative and y positive?","Second quadrant","First quadrant","Third quadrant","Fourth quadrant","First (+,+), Second (−,+), Third (−,−), Fourth (+,−)."],
["The distance between points (x₁, y₁) and (x₂, y₂) is…","√[(x₂−x₁)² + (y₂−y₁)²]","(x₂−x₁) + (y₂−y₁)","(x₂−x₁)(y₂−y₁)","x₂y₂ − x₁y₁","This formula comes from Pythagoras' theorem."],
["The distance between (0, 0) and (3, 4) is…","5","7","25","12","√(9 + 16) = √25 = 5."],
["An angle is formed when…","Two rays meet at a common endpoint","Two parallel lines meet","A circle is cut in half","A line is extended","The common endpoint is the vertex."],
["A complete revolution equals…","360°","180°","90°","100°","A full turn is 360 degrees."],
["The relationship between degrees and minutes of arc is…","1° = 60′","1° = 100′","1° = 30′","1° = 360′","One degree equals 60 minutes of arc."],

["One nautical mile equals…","1,852 metres","1,000 metres","1,609 metres","1,500 metres","1 NM = 1,852 m = 1.852 km."],
["A knot is a unit of speed equal to…","One nautical mile per hour","One kilometre per hour","One metre per second","One mile per minute","1 knot = 1 NM/hour."],
["The formula for speed is…","Speed = Distance / Time","Speed = Distance × Time","Speed = Time / Distance","Speed = Distance + Time","Distance = Speed × Time and Time = Distance / Speed also follow."],
["A ship travels 150 NM in 10 hours. Its speed is…","15 knots","1.5 knots","150 knots","10 knots","150 ÷ 10 = 15 knots."],
["A ship travels at 12 knots for 5 hours. The distance travelled is…","60 NM","17 NM","2.4 NM","120 NM","12 × 5 = 60 NM."],

<script>
(function () {
'use strict';

/* ---------- Data ---------- */
var DATA = window.QUIZ_DATA || {};
var SUBJECTS = ['math', 'physics', 'cs', 'ship', 'english'].filter(function (k) { return DATA[k]; });
var DIFF = ['Easy', 'Medium', 'Difficult', 'Expert'];
var DIFF_MAP = [0, 0, 0, 0, 1, 1, 1, 2, 2, 3];
var NEG = 0.25;
var BANK = [];
var BY_ID = {};

SUBJECTS.forEach(function (s) {
  DATA[s].q.forEach(function (r, i) {

    BANK.push(it);

});

/* ---------- Helpers ---------- */
function $(sel) { return document.querySelector(sel); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var mm = (m < 10 ? '0' : '') + m, ss = (s < 10 ? '0' : '') + s;
  return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
}
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function toast(msg) {
  var t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function subjName(s) { return DATA[s] ? DATA[s].name : s; }
function chapName(s, ch) { return DATA[s] ? DATA[s].chapters[ch] : ''; }
function barClass(p) { return p >= 75 ? 'ok' : (p >= 50 ? 'warn' : 'bad'); }

/* ---------- Storage ---------- */
var KEY = 'imuNauticalQuiz.v1';
function defaults() { return { bm: [], wrong: {}, hist: [], daily: {}, stats: {}, target: 10, theme: 'light' }; }
function load() {
  try {
    var raw = localStorage.getItem(KEY);

      var o = JSON.parse(raw), d = defaults();
      for (var k in d) { if (!(k in o)) o[k] = d[k]; }
      return o;
    }
  } catch (e) { /* ignore */ }
  return defaults();
}
var S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------- State ---------- */
var current = 'dashboard';
var session = null;
var timerId = null;
var revTab = 'wrong';
var cfg = { subject: SUBJECTS[0] || 'all', chapters: [], diffs: [0, 1, 2, 3], count: 10, time: 0, mode: 'practice', order: 'random', neg: false };

/* ---------- Statistics ---------- */
function chapterStats() {
  var out = {};
  BANK.forEach(function (it) {
    var st = S.stats[it.id];
    if (!st) return;
    var k = it.s + ':' + it.ch;
    var o = out[k] || (out[k] = { s: it.s, ch: it.ch, a: 0, c: 0 });
    o.a += st.a; o.c += st.c;
  });
  return out;
}
function subjectStats(s) {
  var a = 0, c = 0;
  BANK.forEach(function (it) {
    if (s && it.s !== s) return;
    var st = S.stats[it.id];
    if (st) { a += st.a; c += st.c; }
  });
  return { a: a, c: c, p: pct(c, a) };
}
function weakList() {
  var cs = chapterStats();
  return Object.keys(cs).map(function (k) { return cs[k]; })
    .filter(function (o) { return o.a >= 3 && o.c / o.a < 0.75; })
    .sort(function (x, y) { return x.c / x.a - y.c / y.a; });
}
function wrongIds() { return Object.keys(S.wrong).filter(function (id) { return BY_ID[id]; }); }
function bmIds() { return S.bm.filter(function (id) { return BY_ID[id]; }); }

/* ---------- Timer ---------- */
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function timerText() {
  var sec = Math.floor((Date.now() - session.start) / 1000);
  if (session.limit) return '⏱ ' + fmt(session.limit - sec) + ' left';
  return '⏱ ' + fmt(sec);
}
function startTimer() {
  stopTimer();
  timerId = setInterval(function () {
    if (!session || session.done) { stopTimer(); return; }
    var sec = Math.floor((Date.now() - session.start) / 1000);
    if (session.limit && session.limit - sec <= 0) {
      toast("Time is up! Your quiz was submitted.");
      finish();
      return;
    }
    var el = $('#timer');
    if (el) {
      el.textContent = timerText();
      if (session.limit) el.classList.toggle('warn', session.limit - sec <= 60);
    }
  }, 1000);
}

/* ---------- Session ---------- */
function startSession(items, o) {
  if (!items.length) { toast('No questions available for this selection.'); return; }
  var qs = items.map(function (it) {
    var opts = shuffle(it.opts.map(function (t, i) { return { t: t, ok: i === 0 }; }));
    return { it: it, opts: opts };
  });
  session = {
    qs: qs,
    ans: qs.map(function () { return null; }),
    mark: qs.map(function () { return false; }),
    locked: qs.map(function () { return false; }),
    i: 0, start: Date.now(), limit: (o.time || 0) * 60,
    mode: o.mode || 'practice', neg: !!o.neg, label: o.label || 'Quiz',
    done: false, rf: 'all', result: null
  };
  startTimer();
  current = 'quiz';
  render();
  window.scrollTo(0, 0);
}

function finish() {
  if (!session || session.done) return;
  stopTimer();
  session.done = true;
  var elapsed = Math.round((Date.now() - session.start) / 1000);
  if (session.limit) elapsed = Math.min(elapsed, session.limit);
  var correct = 0, wrong = 0, un = 0, chap = {};
  session.qs.forEach(function (q, i) {
    var a = session.ans[i];
    var key = q.it.s + ':' + q.it.ch;
    var c = chap[key] || (chap[key] = { s: q.it.s, ch: q.it.ch, t: 0, c: 0 });
    c.t++;
    var st = S.stats[q.it.id] || (S.stats[q.it.id] = { a: 0, c: 0 });
    if (a === null) { un++; return; }
    st.a++;
    if (q.opts[a].ok) { correct++; c.c++; st.c++; delete S.wrong[q.it.id]; }
    else { wrong++; S.wrong[q.it.id] = (S.wrong[q.it.id] || 0) + 1; }
  });
  var total = session.qs.length;
  var score = correct - (session.neg ? NEG * wrong : 0);
  score = Math.round(score * 100) / 100;
  var res = { total: total, correct: correct, wrong: wrong, un: un, score: score, max: total, pct: pct(correct, total), time: elapsed, chap: chap };
  session.result = res;
  var dk = todayKey();
  S.daily[dk] = (S.daily[dk] || 0) + correct + wrong;
  S.hist.unshift({ date: new Date().toISOString(), label: session.label, mode: session.mode, total: total, correct: correct, wrong: wrong, un: un, score: score, pct: res.pct, time: elapsed });
  if (S.hist.length > 100) S.hist.length = 100;
  save();
  current = 'results';
  render();
  window.scrollTo(0, 0);
}

function perfLabel(p) {
  if (p >= 90) return 'Excellent';
  if (p >= 75) return 'Very Good';
  if (p >= 60) return 'Good';
  if (p >= 40) return 'Needs Improvement';
  return 'Keep Practising';
}

/* ---------- Navigation ---------- */
function go(v) {
  if (session && !session.done && v !== 'quiz') {
    if (!window.confirm('Leave this quiz? Your current progress will be lost.')) return;
    stopTimer();
    session = null;
  }
  current = v;
  render();
  window.scrollTo(0, 0);
}

/* ---------- Views ---------- */
function viewDashboard() {
  var tot = subjectStats(null);
  var today = S.daily[todayKey()] || 0;
  var dp = Math.min(100, pct(today, S.target));
  var w = weakList().slice(0, 5);

function stat(v, l) { return '<div class="card stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }
function sel(name, opts, cur) {

function pool() {

  });
}

function viewQuiz() {

    h += '<button class="' + cls + '" data-a="choose" data-v="' + j + '"' + (locked ? ' disabled' : '') + '><span class="l">' + 'ABCD'.charAt(j) + '</span><span>' + esc(o.t) + '</span></button>';
  });
  h += '</div>';
  if (locked) {
    var ok = q.opts[ans].ok;

    h += '<div class="explain ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? '✅ Correct!' : '❌ Incorrect.') + '</b>' + (ok ? '' : ' The correct answer is: <b>' + esc(right) + '</b>.') + '<br>' + esc(it.ex) + '</div>';

  s.qs.forEach(function (_, k) {

function reviewItem(q, i, a, showBm) {
  var it = q.it;
  var st = a === null ? 'un' : (q.opts[a].ok ? 'ok' : 'bad');
  var stTxt = a === null ? '⚠ Unanswered' : (st === 'ok' ? '✅ Correct' : '❌ Incorrect');
  var h = '<div class="review-item ' + st + '"><div class="qhead"><b>Q' + (i + 1) + '</b><span class="badge">' + esc(subjName(it.s)) + '</span><span class="badge">' + esc(chapName(it.s, it.ch)) + '</span><span class="badge d' + it.diff + '">' + DIFF[it.diff] + '</span><span class="small">' + stTxt + '</span>';
  if (showBm) h += '<button class="star' + (S.bm.indexOf(it.id) >= 0 ? ' on' : '') + '" data-a="bm" data-v="' + it.id + '" aria-label="Bookmark">' + (S.bm.indexOf(it.id) >= 0 ? '★' : '☆') + '</button>';
  h += '</div><p style="font-weight:600;margin:.5rem 0">' + esc(it.q) + '</p>';
  q.opts.forEach(function (o, j) {
    var cls = 'ropt' + (o.ok ? ' right' : (j === a ? ' wrong' : ''));
    var tag = o.ok ? ' ✔ Correct answer' : '';
    if (j === a) tag += ' ← Your answer';
    h += '<div class="' + cls + '"><b>' + 'ABCD'.charAt(j) + '.</b> ' + esc(o.t) + '<span class="muted small">' + esc(tag) + '</span></div>';
  });
  h += '<div class="explain"><b>Explanation:</b> ' + esc(it.ex) + '</div></div>';
  return h;
}

/* ---------- Render ---------- */
function render() {
  var app = $('#app');
  if (!app) return;
  if ((current === 'quiz' || current === 'results') && !session) current = 'dashboard';
  var fn = { dashboard: viewDashboard, setup: viewSetup, quiz: viewQuiz, results: viewResults, revision: viewRevision, history: viewHistory }[current] || viewDashboard;
  app.innerHTML = fn();
  var navKey = (current === 'quiz' || current === 'results') ? 'setup' : current;
  var btns = document.querySelectorAll('#nav button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-v') === navKey);
  if (current === 'setup') updateSetupInfo();
  document.documentElement.setAttribute('data-theme', S.theme);
  var tb = $('#themeBtn');
  if (tb) tb.textContent = S.theme === 'dark' ? '☀️' : '🌙';
}

/* ---------- Quick starts ---------- */
function startQuick(s) {
  var items = shuffle(BANK.filter(function (it) { return it.s === s; })).slice(0, 10);
  startSession(items, { mode: 'practice', time: 0, neg: false, label: DATA[s].name + ' – Quick Quiz' });
}
function startDaily() {
  var items = shuffle(BANK.slice()).slice(0, S.target);
  startSession(items, { mode: 'practice', time: 0, neg: false, label: 'Daily Practice' });
}
function startFullSemester() {
  var items = [];
  SUBJECTS.forEach(function (s) {
    items = items.concat(shuffle(BANK.filter(function (it) { return it.s === s; })).slice(0, 10));
  });
  startSession(shuffle(items), { mode: 'exam', time: 60, neg: true, label: 'Full Semester Practice Test' });
}
function startWeak() {
  var list = weakList().slice(0, 3);
  if (!list.length) { toast('No weak topics yet. Take a few quizzes first!'); return; }
  var items = BANK.filter(function (it) { return list.some(function (o) { return o.s === it.s && o.ch === it.ch; }); });
  startSession(shuffle(items).slice(0, 20), { mode: 'practice', time: 0, neg: false, label: 'Weak Topics Practice' });
}
function startFromSetup() {
  var p = pool();
  if (!p.length) { toast('No questions match your selection.'); return; }
  var items = cfg.order === 'random' ? shuffle(p.slice()) : p.slice();
  var n = cfg.count > 0 ? Math.min(cfg.count, items.length) : items.length;
  items = items.slice(0, n);
  var time = cfg.time, neg = cfg.neg;
  if (cfg.mode === 'exam') { neg = true; if (!time) time = Math.max(5, n); }
  var modeName = { practice: 'Practice', selftest: 'Self-Test', exam: 'Exam' }[cfg.mode];
  var label = (cfg.subject === 'all' ? 'All Subjects' : DATA[cfg.subject].name) + ' – ' + modeName;
  startSession(items, { mode: cfg.mode, time: time, neg: neg, label: label });
}

/* ---------- Report download ---------- */
function downloadReport() {
  var s = session, r = s.result;
  var L = [];
  L.push('IMU B.Sc. Nautical Science – Self-Study Quiz Report');
  L.push('Quiz: ' + s.label);
  L.push('Date: ' + new Date().toLocaleString());
  L.push('');
  L.push('Total questions : ' + r.total);
  L.push('Correct         : ' + r.correct);
  L.push('Incorrect       : ' + r.wrong);
  L.push('Unanswered      : ' + r.un);
  L.push('Score           : ' + r.score + ' / ' + r.max + (s.neg ? ' (negative marking -' + NEG + ')' : ''));
  L.push('Accuracy        : ' + r.pct + '% (' + perfLabel(r.pct) + ')');
  L.push('Time taken      : ' + fmt(r.time));
  L.push('');
  L.push('Chapter-wise performance');
  Object.keys(r.chap).sort().forEach(function (k) {
    var c = r.chap[k];
    L.push(' - ' + subjName(c.s) + ' / ' + chapName(c.s, c.ch) + ': ' + c.c + '/' + c.t);
  });
  L.push('');
  L.push('Question review');
  s.qs.forEach(function (q, i) {
    var a = s.ans[i];
    var right = q.opts.filter(function (o) { return o.ok; })[0].t;
    L.push((i + 1) + '. ' + q.it.q);
    L.push('   Your answer   : ' + (a === null ? '(unanswered)' : q.opts[a].t));
    L.push('   Correct answer: ' + right);
    L.push('   Explanation   : ' + q.it.ex);
  });
  try {
    var blob = new Blob([L.join('\n')], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'quiz-report.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) { toast('Could not create the report on this browser.'); }
}

/* ---------- Actions ---------- */
function toggleBm(id) {
  var i = S.bm.indexOf(id);
  if (i >= 0) { S.bm.splice(i, 1); toast('Bookmark removed'); }
  else { S.bm.push(id); toast('Question bookmarked'); }
  save();
  render();
}

var actions = {
  nav: function (v) { go(v); },
  theme: function () { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); render(); },
  daily: startDaily,
  fullsem: startFullSemester,
  weak: startWeak,
  quick: function (v) { startQuick(v); },
  pickSubject: function (v) { cfg.subject = v; cfg.chapters = []; go('setup'); },
  setSubject: function (v) { cfg.subject = v; cfg.chapters = []; render(); },
  allChapters: function () { cfg.chapters = []; render(); },
  toggleChapter: function (v) {
    var n = parseInt(v, 10), i = cfg.chapters.indexOf(n);
    if (i >= 0) cfg.chapters.splice(i, 1); else cfg.chapters.push(n);
    render();
  },
  toggleDiff: function (v) {
    var n = parseInt(v, 10), i = cfg.diffs.indexOf(n);
    if (i >= 0) { if (cfg.diffs.length > 1) cfg.diffs.splice(i, 1); else toast('Select at least one difficulty level'); }
    else cfg.diffs.push(n);
    render();
  },
  startSetup: startFromSetup,
  choose: function (v) {
    if (!session || session.done) return;
    var j = parseInt(v, 10);
    if (session.locked[session.i]) return;
    session.ans[session.i] = j;
    if (session.mode === 'practice') session.locked[session.i] = true;
    render();
  },
  prev: function () { if (session && session.i > 0) { session.i--; render(); } },
  next: function () { if (session && session.i < session.qs.length - 1) { session.i++; render(); } },
  clear: function () { if (session && !session.locked[session.i]) { session.ans[session.i] = null; render(); } },
  mark: function () { if (session) { session.mark[session.i] = !session.mark[session.i]; render(); } },
  jump: function (v) { if (session) { session.i = parseInt(v, 10); render(); } },
  submit: function () {
    if (!session || session.done) return;
    var un = session.ans.filter(function (a) { return a === null; }).length;
    if (un > 0 && !window.confirm('You have ' + un + ' unanswered question' + (un > 1 ? 's' : '') + '. Submit the quiz anyway?')) return;
    finish();
  },
  bm: function (v) { toggleBm(v); },
  rf: function (v) { if (session) { session.rf = v; render(); } },
  retryWrong: function () {
    if (!session) return;
    var items = [];
    session.qs.forEach(function (q, i) {
      var a = session.ans[i];
      if (a === null || !q.opts[a].ok) items.push(q.it);
    });
    startSession(items, { mode: 'practice', time: 0, neg: false, label: 'Retry – Incorrect Questions' });
  },
  download: downloadReport,
  revTab: function (v) { revTab = v; render(); },
  practiseRev: function () {
    var ids = revTab === 'wrong' ? wrongIds() : bmIds();
    var items = shuffle(ids.map(function (id) { return BY_ID[id]; })).slice(0, 50);
    startSession(items, { mode: 'practice', time: 0, neg: false, label: revTab === 'wrong' ? 'Revision – Incorrect Answers' : 'Revision – Bookmarks' });
  },
  removeRev: function (v) {
    if (revTab === 'wrong') delete S.wrong[v];
    else { var i = S.bm.indexOf(v); if (i >= 0) S.bm.splice(i, 1); }
    save();
    render();
  },
  clearHist: function () {
    if (!window.confirm('This will delete all quiz history, bookmarks and progress on this device. Continue?')) return;
    var theme = S.theme;
    S = defaults();
    S.theme = theme;
    save();
    render();
    toast('All progress cleared');
  }
};

var changes = {
  count: function (t) { cfg.count = parseInt(t.value, 10); updateSetupInfo(); },
  time: function (t) { cfg.time = parseInt(t.value, 10); },
  mode: function (t) { cfg.mode = t.value; updateSetupInfo(); },
  order: function (t) { cfg.order = t.value; },
  neg: function (t) { cfg.neg = !!t.checked; },
  target: function (t) { S.target = parseInt(t.value, 10) || 10; save(); render(); }
};

document.addEventListener('click', function (e) {
  var t = e.target;
  while (t && t !== document && !(t.getAttribute && t.getAttribute('data-a'))) t = t.parentNode;
  if (!t || t === document) return;
  var a = t.getAttribute('data-a');
  if (t.disabled) return;
  if (actions[a]) actions[a](t.getAttribute('data-v'));
});
document.addEventListener('change', function (e) {
  var t = e.target;
  var c = t && t.getAttribute ? t.getAttribute('data-c') : null;
  if (c && changes[c]) changes[c](t);
});
document.addEventListener('keydown', function (e) {
  if (current !== 'quiz' || !session || session.done) return;
  var tag = e.target && e.target.tagName;
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key >= '1' && e.key <= '4') actions.choose(String(parseInt(e.key, 10) - 1));
  else if (e.key === 'ArrowRight') actions.next();
  else if (e.key === 'ArrowLeft') actions.prev();
});

/* ---------- Init ---------- */
render();
})();

</script>
</body>
</html>
